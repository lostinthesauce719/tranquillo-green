<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale.0">
<meta name="description" content="Financial operations built for cannabis. Multi-entity accounting, automated 280E allocations, Metrc-integrated inventory, and cash reconciliation — in one platform.">
<title>Tranquillo Green — Cannabis Financial Operations Platform">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080d19;
  --surface: #0e1526;
  --surface-raised: #141d33;
  --border: #1e2d4a;
  --text: #f1f5f9;
  --text-sec: #cbd5e1;
  --text-muted: #7c8db5;
  --text-faint: #475569;
  --brand: #22855a;
  --brand-soft: rgba(34,133,90,0.12);
  --accent: #d4922a;
  --accent-soft: rgba(212,146,42,0.12);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;background-image:radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34,133,90,0.06), transparent),radial-gradient(ellipse 60% 40% at 80% 100%, rgba(212,146,42,0.03), transparent)}
a{color:inherit;text-decoration:none}
img{max-width:100%}

/* Layout */
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}

/* Nav */
.nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-brand svg{width:32px;height:32px}
.nav-brand .name{font-size:18px;font-weight:700;letter-spacing:-0.02em}
.nav-brand .sub{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.15em;color:var(--brand)}
.nav-links{display:flex;align-items:center;gap:24px}
.nav-links a{font-size:13px;color:var(--text-muted);transition:color .2s}
.nav-links a:hover{color:var(--text)}
.nav-cta{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;background:var(--brand);color:#fff;font-size:13px;font-weight:600;border-radius:10px;transition:all .2s}
.nav-cta:hover{background:rgba(34,133,90,0.9);transform:translateY(-1px)}

/* Hero */
.hero{text-align:center;padding:80px 0 60px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border:1px solid var(--border);border-radius:100px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.2em;color:var(--accent);background:rgba(14,21,38,0.6);backdrop-filter:blur(8px)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.hero h1{font-size:clamp(32px, 5vw, 56px);font-weight:800;line-height:1.08;letter-spacing:-0.03em;margin-top:28px}
.hero h1 .accent{color:var(--accent)}
.hero .subhead{font-size:clamp(20px, 3vw, 32px);font-weight:700;color:var(--brand);margin-top:12px;line-height:1.2}
.hero p{max-width:600px;margin:20px auto 0;font-size:17px;color:var(--text-sec);line-height:1.7}
.cta-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:36px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:12px;font-size:14px;font-weight:600;transition:all .2s;cursor:pointer;border:none;font-family:var(--font)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.2)}
.btn-primary:hover{background:rgba(34,133,90,0.9);transform:translateY(-1px);box-shadow:0 4px 12px rgba(34,133,90,0.25)}
.btn-secondary{background:rgba(34,133,90,0.1);color:var(--brand);border:1px solid rgba(34,133,90,0.3)}
.btn-secondary:hover{background:rgba(34,133,90,0.15)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:rgba(212,146,42,0.9)}
.trust-row{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:20px;font-size:12px;color:var(--text-muted)}
.trust-row span{display:flex;align-items:center;gap:6px}
.trust-row svg{width:14px;height:14px;color:var(--brand)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:32px;border:1px solid var(--border);border-radius:16px;background:rgba(14,21,38,0.6);backdrop-filter:blur(8px);margin-top:48px}
.stat{text-align:center}
.stat .num{font-size:clamp(24px, 3vw, 36px);font-weight:800;color:var(--accent)}
.stat .label{font-size:12px;color:var(--text-muted);margin-top:4px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

/* Section headers */
.section-head{text-align:center;margin-bottom:40px}
.section-head .eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.2em;color:var(--text-muted)}
.section-head h2{font-size:clamp(24px, 3vw, 32px);font-weight:700;margin-top:8px}

/* Features grid */
.features{padding:80px 0}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:768px){.grid-3{grid-template-columns:1fr}}
.card{padding:24px;border:1px solid var(--border);border-radius:16px;background:rgba(14,21,38,0.4);backdrop-filter:blur(8px);transition:all .2s}
.card:hover{border-color:rgba(34,133,90,0.3);box-shadow:0 8px 32px rgba(34,133,90,0.08)}
.card svg{width:32px;height:32px;color:var(--brand);margin-bottom:12px}
.card h3{font-size:16px;font-weight:600;margin-bottom:8px}
.card p{font-size:13px;color:var(--text-muted);line-height:1.6}

/* Testimonials */
.testimonials{padding:80px 0}
.testimonials .grid-3{align-items:stretch}
.testimonial-card{padding:24px;border:1px solid var(--border);border-radius:16px;background:rgba(14,21,38,0.4);backdrop-filter:blur(8px);transition:all .2s;height:100%;display:flex;flex-direction:column}
.testimonial-card:hover{border-color:rgba(34,133,90,0.2)}
.stars{display:flex;gap:2px;margin-bottom:12px}
.stars svg{width:14px;height:14px;color:var(--accent)}
.testimonial-card blockquote{font-size:13px;color:var(--text-sec);line-height:1.7;flex:1}
.testimonial-card .author{margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.testimonial-card .author .name{font-size:13px;font-weight:600;color:var(--text)}
.testimonial-card .author .title{font-size:11px;color:var(--text-muted)}
.testimonial-card .author .detail{font-size:10px;color:var(--text-faint);margin-top:2px}

/* Pricing */
.pricing{padding:80px 0}
.pricing-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:800px;margin:0 auto}
@media(max-width:640px){.pricing-grid{grid-template-columns:1fr}}
.price-card{padding:32px;border-radius:16px;transition:all .2s}
.price-card.standard{border:2px solid var(--border);background:var(--surface)}
.price-card.popular{border:2px solid var(--brand);background:var(--surface-raised);box-shadow:0 8px 32px rgba(34,133,90,0.1)}
.price-card h3{font-size:22px;font-weight:700}
.price-card .desc{font-size:13px;color:var(--text-muted);margin-top:4px}
.price-card .price{font-size:48px;font-weight:800;margin:20px 0 0}
.price-card .price span{font-size:16px;font-weight:400;color:var(--text-muted)}
.price-card .billed{font-size:11px;color:var(--brand);font-weight:600;margin-top:4px}
.price-card ul{list-style:none;margin:20px 0;padding:0}
.price-card ul li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-sec);padding:6px 0}
.price-card ul li svg{width:16px;height:16px;color:var(--brand);flex-shrink:0;margin-top:2px}
.price-card .btn{width:100%;justify-content:center;margin-top:20px}
.guarantee{text-align:center;margin-top:20px}
.guarantee span{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid rgba(34,133,90,0.2);border-radius:100px;font-size:13px;color:var(--brand);background:rgba(34,133,90,0.05)}
.guarantee svg{width:14px;height:14px}

/* Dual path */
.dual-path{padding:80px 0}
.dual-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
@media(max-width-width:768px){.dual-grid{grid-template-columns:1fr}}
.dual-card{padding:32px;border-radius:16px}
.dual-card.operators{border:1px solid var(--border);background:var(--surface-raised)}
.dual-card.cpas{border:1px solid rgba(212,146,42,0.2);background:var(--surface-raised)}
.dual-card .eyebrow{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.2em;color:var(--accent)}
.dual-card h3{font-size:22px;font-weight:700;margin-top:12px}
.dual-card p{font-size:13px;color:var(--text-muted);margin-top:12px;line-height:1.7}
.dual-card ul{list-style:none;margin:16px 0;padding:0}
.dual-card ul li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-sec);padding:4px 0}
.dual-card ul li svg{width:14px;height:14px;flex-shrink:0;margin-top:3px}
.dual-card.operators ul li svg{color:var(--brand)}
.dual-card.cpas ul li svg{color:var(--accent)}
.dual-card .cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

/* Calculator teaser */
.calc-teaser{padding:48px;border:1px solid rgba(34,133,90,0.2);border-radius:16px;background:linear-gradient(135deg, rgba(34,133,90,0.05), var(--surface));display:flex;align-items:center;gap:40px}
@media(max-width:768px){.calc-teaser{flex-direction:column;gap:24px}}
.calc-teaser .left{flex:1}
.calc-teaser .eyebrow{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.2em;color:var(--brand)}
.calc-teaser h3{font-size:28px;font-weight:700;margin-top:12px}
.calc-teaser p{font-size:14px;color:var(--text-muted);margin-top:12px;line-height:1.7}
.calc-teaser .stat-box{width:200px;padding:24px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-align:center;flex-shrink:0}
.calc-teaser .stat-box .big{font-size:40px;font-weight:800;color:var(--brand)}
.calc-teaser .stat-box .small{font-size:12px;color:var(--text-muted);margin-top:4px}

/* Final CTA */
.final-cta{text-align:center;padding:80px 0}
.final-cta h2{font-size:clamp(24px, 3vw, 32px);font-weight:700}
.final-cta p{font-size:15px;color:var(--text-muted);max-width:500px;margin:12px auto 0;line-height:1.7}

/* Footer */
.footer{border-top:1px solid var(--border);padding:32px 0;text-align:center}
.footer-links{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;margin-bottom:16px}
.footer-links a{font-size:12px;color:var(--text-faint);transition:color .2s}
.footer-links a:hover{color:var(--text-muted)}
.footer-copy{font-size:11px;color:var(--text-faint)}

/* Mobile nav */
@media(max-width:640px){
  .nav-links{display:none}
  .hero{padding:48px 0 40px}
  .stats{padding:20px}
}
</style>
</head>
