name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the newest commit on a branch needs to be verified. Without this,
# superseded runs sit in the queue competing for runners and get killed at the
# queue timeout, which surfaces as a "failure" that has nothing to do with the
# code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test tests/*.test.ts

      - name: Build
        run: npm run build
